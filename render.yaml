# Render Blueprint: one free web service running the API *and* the execution worker in one process.
# Postgres (Neon) and Redis (Redis Cloud) are external free tiers; see docs/FREE_DEPLOYMENT.md.
# Render dashboard -> New -> Blueprint -> pick this repository -> fill in the prompted values.
services:
  - type: web
    name: nse-paper-trading-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to India; put Neon and Redis Cloud in Singapore/Mumbai too
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # --- prompted once when the Blueprint is created (never committed) ---
      - key: DATABASE_URL # Neon *direct* (non-pooled) connection string, ending in ?sslmode=verify-full
        sync: false
      - key: REDIS_URL # Redis Cloud: redis://default:<password>@<host>:<port>
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://nse-paper-trading.vercel.app
        sync: false
      # --- generated by Render ---
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET # copy into the GitHub repo secret CRON_SECRET for the scheduled-jobs workflow
        generateValue: true
      # --- free-tier mode ---
      - key: NODE_ENV
        value: production
      - key: EXECUTION_MODE
        value: queue
      - key: RUN_WORKER # no free background workers on Render, so the worker runs in the API process
        value: 'true'
      - key: MIGRATE_ON_START # no free pre-deploy step either; migrations are advisory-locked
        value: 'true'
      - key: SEED_ON_START # idempotent: NIFTY 50 sync, missing candles only, demo account
        value: 'true'
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: QUOTE_POLL_INTERVAL_MS # 15 s keeps free Redis well under its ops/sec cap
        value: '15000'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: LOG_LEVEL
        value: info
